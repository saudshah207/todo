<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
  </head>
  <body class="grid">
    <aside class="flex flex-column standard-padding standard-gap">
      <h2>Todo App</h2>
      <button data-action="display-add-todo-dialog" class="button">
        Add New +
      </button>
    </aside>
    <main class="standard-padding">
      <h1 class="main-title">Your Todos</h1>
      <ul class="todos list-style-none"></ul>
    </main>

    <div inert data-ui="add-todo-dialog" class="dialog standard-padding" data-state="closed">
      <form data-ui="add-todo-form" action="" class="flex flex-column standard-gap">
        <label class="flex flex-wrap" for="title">
          <span class="label-text">Title:</span>
          <input type="text" name="title" id="title" required />
        </label>
        <label class="flex flex-wrap" for="description">
          <span class="label-text">Description:</span>
          <textarea name="description" id="description"></textarea>
        </label>
        <label class="flex flex-wrap" for="dueDate">
          <span class="label-text">Due:</span>
          <input type="date" name="dueDate" id="dueDate" />
        </label>
        <label class="flex flex-wrap" for="priority">
          <span class="label-text">Priority:</span>
          <select name="priority" id="priority">
            <option value="">None</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </label>
        <label class="flex flex-wrap" for="check-items">
          <span class="label-text">Checklist:</span>
          <div class="flex flex-column standard-gap">
            <ul id="check-items" class="display-none check-items list-style-none flex flex-column standard-gap"></ul>
            <button data-action="add-check-item" class="button check-item-add-button" type="button">
              Add item +
            </button>
          </div>
        </label>

        <div class="action-buttons flex flex-wrap">
          <button class="button">Add</button>
          <button data-action="close-dialog" class="button" type="button">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
