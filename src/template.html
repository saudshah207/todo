<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
  </head>
  <body class="grid">
    <aside class="flex flex-column standard-padding standard-gap">
      <h2>Todo App</h2>
      <button data-action="display-add-todo-dialog" class="button">
        Add New +
      </button>

      <h2>Projects</h2>
      <ul data-ui="projects" class="display-none list-style-none flex flex-column standard-gap"></ul>
      <button data-action="display-add-project-dialog" class="button">
        Create New Project +
      </button>
    </aside>
    <main class="standard-padding">
      <h1 class="main-title">Your Todos</h1>
      <ul class="todos list-style-none"></ul>
    </main>

    <div inert data-ui="add-todo-dialog" class="dialog" data-state="closed">
      <form
        data-ui="add-todo-form"
        action=""
        class="flex flex-column standard-gap"
      >
        <label class="flex flex-wrap" for="add-title">
          <span class="label-text">Title:</span>
          <input type="text" name="title" id="add-title" required />
        </label>
        <label class="flex flex-wrap" for="add-description">
          <span class="label-text">Description:</span>
          <textarea name="description" id="add-description"></textarea>
        </label>
        <label class="flex flex-wrap" for="add-dueDate">
          <span class="label-text">Due:</span>
          <input type="date" name="dueDate" id="add-dueDate" />
        </label>
        <label class="flex flex-wrap" for="add-priority">
          <span class="label-text">Priority:</span>
          <div class="select-wrapper flex">
            <select name="priority" id="add-priority">
              <option value="">None</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </label>
        <label class="flex flex-wrap" for="add-check-items">
          <span class="label-text">Checklist:</span>
          <div class="check-items-wrapper flex flex-column standard-gap">
            <ul
              id="add-check-items"
              data-ui="check-items"
              class="display-none list-style-none flex flex-column standard-gap"
            ></ul>
            <button
              data-action="add-check-item"
              class="button check-item-add-button"
              type="button"
            >
              Add item +
            </button>
          </div>
        </label>

        <div class="action-buttons flex flex-wrap">
          <button class="button">Add</button>
          <button
            data-action="close-dialog"
            class="button light-button"
            type="button"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>

    <div inert data-ui="edit-todo-dialog" class="dialog" data-state="closed">
      <form
        data-ui="edit-todo-form"
        action=""
        class="flex flex-column standard-gap"
      >
        <label class="flex flex-wrap" for="edit-title">
          <span class="label-text">Title:</span>
          <input type="text" name="title" id="edit-title" required />
        </label>
        <label class="flex flex-wrap" for="edit-description">
          <span class="label-text">Description:</span>
          <textarea name="description" id="edit-description"></textarea>
        </label>
        <label class="flex flex-wrap" for="edit-dueDate">
          <span class="label-text">Due:</span>
          <input type="date" name="dueDate" id="edit-dueDate" />
        </label>
        <label class="flex flex-wrap" for="edit-priority">
          <span class="label-text">Priority:</span>
          <div class="select-wrapper flex">
            <select name="priority" id="edit-priority">
              <option value="">None</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </label>
        <label class="flex flex-wrap" for="edit-check-items">
          <span class="label-text">Checklist:</span>
          <div class="check-items-wrapper flex flex-column standard-gap">
            <ul
              id="edit-check-items"
              data-ui="check-items"
              class="display-none list-style-none flex flex-column standard-gap"
            ></ul>
            <button
              data-action="add-check-item"
              class="button check-item-add-button"
              type="button"
            >
              Add item +
            </button>
          </div>
        </label>

        <div class="action-buttons flex flex-wrap">
          <button class="button">Save Changes</button>
          <button
            data-action="close-dialog"
            class="button light-button"
            type="button"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>

    <div inert data-ui="add-project-dialog" class="dialog" data-state="closed">
      <h3 class="dialog-title">Create Project</h3>

      <form
        data-ui="add-project-form"
        action=""
        class="flex flex-column standard-gap"
      >
        <label class="flex flex-wrap" for="add-project-title">
          <span class="label-text">Title:</span>
          <input type="text" name="title" id="add-project-title" required />
        </label>

        <div class="action-buttons flex flex-wrap">
          <button class="button">Create</button>
          <button
            data-action="close-dialog"
            class="button light-button"
            type="button"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
