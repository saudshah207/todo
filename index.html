<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Todo App</title><script defer="defer" src="main.js"></script></head><body class="grid"><aside class="flex flex-column standard-padding standard-gap"><h2>Todo App</h2><button data-action="display-all-todos" class="button light-button font-weight-bold">See All Todos</button> <button data-action="display-add-todo-dialog" class="button">Add New +</button><h2>Projects</h2><ul data-ui="projects" class="display-none list-style-none flex flex-column standard-gap"></ul><button data-action="display-add-project-dialog" class="button">Create New Project +</button></aside><main class="standard-padding"><header class="main-header flex flex-wrap align-items-center standard-gap"><h1 data-ui="main-title" class="main-title">Your Todos</h1><div data-ui="project-action-buttons" class="display-none flex flex-wrap standard-gap"><button data-action="edit-project" class="button light-button">Edit</button> <button data-action="delete-project" class="button light-button">Delete</button></div></header><p data-ui="message" class="display-none"></p><ul class="todos list-style-none"></ul></main><div inert data-ui="add-todo-dialog" class="dialog" data-state="closed"><h3 class="dialog-title">Add Todo</h3><form data-ui="add-todo-form" action="" class="flex flex-column standard-gap"><label class="flex flex-wrap" for="add-title"><span class="label-text">Title:</span> <input name="title" id="add-title" required/></label> <label class="flex flex-wrap" for="add-description"><span class="label-text">Description:</span> <textarea name="description" id="add-description"></textarea></label> <label class="flex flex-wrap" for="add-dueDate"><span class="label-text">Due:</span> <input type="date" name="dueDate" id="add-dueDate"/></label> <label class="flex flex-wrap" for="add-priority"><span class="label-text">Priority:</span><div class="select-wrapper flex"><select name="priori standard-gap"></ul><button data-action="add-check-item" class="button check-item-add-button" type="button">Add item +</button></div></label><div class="action-buttons flex flex-wrap"><button class="button">Save Changes</button> <button data-action="close-dialog" class="button light-button" type="button">Cancel</button></div></form></div><div inert data-ui="add-project-dialog" class="dialog" data-state="closed"><h3 class="dialog-title">Create Project</h3><form data-ui="add-project-form" action="" class="flex flex-column standard-gap"><label class="flex flex-wrap" for="add-project-title"><span class="label-text">Title:</span> <input name="title" id="add-project-title" required/></label><div class="action-buttons flex flex-wrap"><button class="button">Create</button> <button data-action="close-dialog" class="button light-button" type="button">Cancel</button></div></form></div><div inert data-ui="delete-project-dialog" class="dialog" data-state="closed"><h3 class="dialog-title">Delete Project</h3><form data-ui="delete-project-form" action="" class="flex flex-column standard-gap"><p>Are you sure you want to delete this project? This won't delete any todos inside this project.</p><div class="action-buttons flex flex-wrap"><button class="button">Delete</button> <button data-action="close-dialog" class="button light-button" type="button">Cancel</button></div></form></div><div inert data-ui="edit-project-dialog" class="dialog" data-state="closed"><h3 class="dialog-title">Edit Project Name</h3><form data-ui="edit-project-form" action="" class="flex flex-column standard-gap"><label class="flex flex-wrap" for="edit-project-title"><span class="label-text">Title:</span> <input name="title" id="edit-project-title" required/></label><div class="action-buttons flex flex-wrap"><button class="button">Save Changes</button> <button data-action="close-dialog" class="button light-button" type="button">Cancel</button></div></form></div><div inert data-ui="todo-action-dialog" class="dialog"
